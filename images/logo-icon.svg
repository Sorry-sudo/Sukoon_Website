<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A0C9"/>
      <stop offset="50%" style="stop-color:#E8B47C"/>
      <stop offset="100%" style="stop-color:#D4805C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0A1A"/>
      <stop offset="100%" style="stop-color:#1A1530"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#roseGrad)" stroke-width="2"/>
  
  <!-- Mountain Range -->
  <path d="M20 75 L35 40 L45 55 L55 35 L65 50 L75 40 L80 75 Z" 
        fill="url(#roseGrad)" 
        opacity="0.9"/>
  
  <path d="M25 75 L35 40 L47 58 L55 40 L67 55 L75 43 L80 75 Z" 
        fill="url(#roseGrad)"/>
  
  <!-- Star/Peak Highlight -->
  <circle cx="35" cy="40" r="2.5" fill="#E8B47C"/>
  <circle cx="55" cy="35" r="2.5" fill="#E8B47C"/>
  <circle cx="75" cy="40" r="2" fill="#E8B47C" opacity="0.8"/>
  
  <!-- Decorative Border Dots -->
  <circle cx="50" cy="8" r="2" fill="url(#roseGrad)"/>
  <circle cx="50" cy="92" r="2" fill="url(#roseGrad)"/>
  <circle cx="8" cy="50" r="2" fill="url(#roseGrad)"/>
  <circle cx="92" cy="50" r="2" fill="url(#roseGrad)"/>
</svg>
